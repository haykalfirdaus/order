<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E67E22;
            --secondary: #2C3E50;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #2D3748;
            --text-muted: #718096;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            text-align: center;
        }

        .error-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.06);
            border: 1px solid #E2E8F0;
        }

        .error-icon {
            font-size: 72px;
            color: #CBD5E0;
            margin-bottom: 16px;
            position: relative;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .error-icon i {
            background: -webkit-linear-gradient(#E67E22, #E53E3E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .error-code {
            font-size: 56px;
            font-weight: 700;
            color: var(--secondary);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--secondary);
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #1A252F;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(44, 62, 80, 0.2);
        }

        .btn-home i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon">
            <i class="fa-solid fa-pizza-slice fa-flip-horizontal"></i>
        </div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Salah Alamat</h2>
        <p class="error-desc">Halaman atau URL yang kamu tuju tidak ditemukan. Pastikan link-nya benar ya!</p>
        
        <a href="/order" class="btn-home">
            <i class="fa-solid fa-cart-shopping"></i> Kembali ke Halaman Order
        </a>
    </div>

</body>
</html>
