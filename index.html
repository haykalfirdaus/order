<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Pizza Mini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E67E22;
            --primary-light: #FFF3E0;
            --secondary: #2C3E50;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #2D3748;
            --text-muted: #718096;
            --border: #E2E8F0;
            --wa-color: #25D366;
            --wa-hover: #1EBE5A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .order-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: linear-gradient(135deg, #243342 0%, #151f28 100%);
            color: white;
            text-align: center;
            padding: 28px 20px 22px;
            position: relative;
        }

        .image-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 14px;
            border-radius: 50%;
            padding: 4px;
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .price-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--primary);
            color: white;
            padding: 5px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 13px;
        }

        .form-content {
            padding: 24px 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-box {
            position: relative;
        }

        .input-box i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0AEC0;
            font-size: 15px;
            pointer-events: none;
        }

        .input-box select.custom-select {
            appearance: none;
            cursor: pointer;
            padding-right: 36px;
        }

        .input-box .chevron-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0AEC0;
            font-size: 12px;
            pointer-events: none;
        }

        .input-control {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text);
            background-color: #FAFAFA;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-control:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        .sub-input {
            margin-top: 8px;
            padding-left: 14px;
            display: none;
        }

        .sub-input.active {
            display: block;
        }

        .grid-kelas {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .grid-kelas .input-box select {
            padding: 11px 10px;
            text-align-last: center;
        }

        .qty-chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .chip-btn {
            background-color: #EDF2F7;
            border: 1.5px solid var(--border);
            padding: 8px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chip-btn:hover {
            border-color: var(--primary);
        }

        .chip-btn .qty {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .chip-btn .price {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .chip-btn.highlight {
            background-color: #FFF8F0;
            border-color: #FBD38D;
            position: relative;
            overflow: hidden;
        }

        .chip-btn.highlight .price {
            color: var(--primary);
            font-weight: 700;
        }

        .chip-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .chip-btn.active .qty,
        .chip-btn.active .price {
            color: white;
        }

        .chip-btn.custom-btn {
            justify-content: center;
        }

        .chip-btn.custom-btn .qty {
            margin-bottom: 0;
        }

        .total-box {
            background-color: var(--primary-light);
            border: 1.5px dashed var(--primary);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            margin: 22px 0;
        }

        .total-box span {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #A0522D;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-box h2 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--wa-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background-color: var(--wa-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 211, 102, 0.25);
        }

        .submit-btn i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="order-container">
        <div class="header">
            <div class="image-container">
                <img src="lagi pengen apa nihh.jpg" alt="Pizza Mini">
            </div>
            <h1>Pizza Mini</h1>
            <div class="price-badge">
                <i class="fa-solid fa-tag"></i> Rp 8.000 / Slice
            </div>
        </div>

        <div class="form-content">
            <form id="orderForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="inputNama" class="input-control" placeholder="Masukkan nama pemesan" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Kelas</label>
                    <div class="grid-kelas" id="gridKelasContainer">
                        <div class="input-box">
                            <select id="tingkatKelas" class="input-control custom-select" required>
                                <option value="" disabled selected>Tingkat</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                            <i class="fa-solid fa-chevron-down chevron-icon"></i>
                        </div>
                        <div class="input-box" id="boxJurusan">
                            <select id="jurusanKelas" class="input-control custom-select" required>
                                <option value="" disabled selected>Jurusan</option>
                                <option value="Saintek">Saintek</option>
                                <option value="Soshum">Soshum</option>
                                <option value="Sainkes">Sainkes</option>
                                <option value="Kedinasan">Kedinasan</option>
                                <option value="Soektis">Soektis</option>
                            </select>
                            <i class="fa-solid fa-chevron-down chevron-icon"></i>
                        </div>
                        <div class="input-box">
                            <select id="nomorKelas" class="input-control custom-select" required>
                                <option value="" disabled selected>No</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                                <option value="16">16</option>
                            </select>
                            <i class="fa-solid fa-chevron-down chevron-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Jumlah Pesanan (Maks 10)</label>
                    <div class="qty-chips">
                        <button type="button" class="chip-btn" data-val="1">
                            <span class="qty">1 Slice</span>
                            <span class="price">8k</span>
                        </button>
                        <button type="button" class="chip-btn highlight" data-val="2">
                            <span class="qty">2 Slice</span>
                            <span class="price">15k</span>
                        </button>
                        <button type="button" class="chip-btn" data-val="3">
                            <span class="qty">3 Slice</span>
                            <span class="price">23k</span>
                        </button>
                        <button type="button" class="chip-btn highlight" data-val="5">
                            <span class="qty">5 Slice</span>
                            <span class="price">38k</span>
                        </button>
                        <button type="button" class="chip-btn highlight" data-val="10">
                            <span class="qty">10 Slice</span>
                            <span class="price">75k</span>
                        </button>
                        <button type="button" class="chip-btn custom-btn" data-val="custom">
                            <span class="qty">Lainnya</span>
                        </button>
                    </div>
                    <input type="number" id="inputJumlahCustom" class="input-control sub-input" placeholder="Masukkan jumlah (Maks 10)" min="1" max="10">
                </div>

                <div class="form-group">
                    <label>Waktu Pengambilan</label>
                    <div class="input-box">
                        <i class="fa-solid fa-clock input-icon"></i>
                        <input type="text" id="inputWaktu" class="input-control" placeholder="Contoh: Istirahat 1 / Jam 10.15" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <div class="input-box">
                        <i class="fa-solid fa-wallet input-icon"></i>
                        <select id="inputPembayaran" class="input-control custom-select" required>
                            <option value="" disabled selected>Pilih metode pembayaran...</option>
                            <option value="QRIS">QRIS</option>
                            <option value="Cash">Cash (Tunai)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                </div>

                <div class="total-box">
                    <span>Total Pembayaran</span>
                    <h2 id="tampilTotal">Rp 0</h2>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-brands fa-whatsapp"></i> Pesan Sekarang
                </button>
            </form>
        </div>
    </div>

    <script>
        let selectedJumlah = 0;

        const tingkatKelas = document.getElementById('tingkatKelas');
        const boxJurusan = document.getElementById('boxJurusan');
        const jurusanKelas = document.getElementById('jurusanKelas');
        const gridKelasContainer = document.getElementById('gridKelasContainer');
        
        const chipButtons = document.querySelectorAll('.chip-btn');
        const inputJumlahCustom = document.getElementById('inputJumlahCustom');
        const tampilTotal = document.getElementById('tampilTotal');
        const orderForm = document.getElementById('orderForm');

        tingkatKelas.addEventListener('change', function() {
            if (this.value === '10') {
                boxJurusan.style.display = 'none';
                jurusanKelas.required = false;
                jurusanKelas.value = '';
                gridKelasContainer.style.gridTemplateColumns = '1fr 1fr';
            } else {
                boxJurusan.style.display = 'block';
                jurusanKelas.required = true;
                gridKelasContainer.style.gridTemplateColumns = '1.2fr 1.5fr 1fr';
            }
        });

        function hitungHarga(jumlah) {
            if (jumlah <= 0) return 0;
            const paketGenap = Math.floor(jumlah / 2);
            const sisaGanjil = jumlah % 2;
            return (paketGenap * 15000) + (sisaGanjil * 8000);
        }

        function updateTotal() {
            if (selectedJumlah > 10) {
                selectedJumlah = 10;
                if (inputJumlahCustom.classList.contains('active')) {
                    inputJumlahCustom.value = 10;
                }
            }
            const total = hitungHarga(selectedJumlah);
            tampilTotal.textContent = 'Rp ' + total.toLocaleString('id-ID');
        }

        chipButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                chipButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const val = this.getAttribute('data-val');
                if (val === 'custom') {
                    inputJumlahCustom.classList.add('active');
                    inputJumlahCustom.focus();
                    selectedJumlah = parseInt(inputJumlahCustom.value) || 0;
                } else {
                    inputJumlahCustom.classList.remove('active');
                    inputJumlahCustom.value = '';
                    selectedJumlah = parseInt(val);
                }
                updateTotal();
            });
        });

        inputJumlahCustom.addEventListener('input', function() {
            let val = parseInt(this.value) || 0;
            if (val > 10) {
                val = 10;
                this.value = 10;
            }
            selectedJumlah = val;
            updateTotal();
        });

        orderForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (selectedJumlah <= 0) {
                alert('Pilih atau masukkan jumlah pesanan terlebih dahulu.');
                return;
            }
            if (selectedJumlah > 10) {
                alert('Maksimal pemesanan adalah 10 slice.');
                return;
            }

            const nama = document.getElementById('inputNama').value.trim();
            const tingkat = tingkatKelas.value;
            const jurusan = jurusanKelas.value;
            const nomor = document.getElementById('nomorKelas').value;
            
            let kelasLengkap = "";
            if (tingkat === '10') {
                kelasLengkap = `${tingkat} ${nomor}`;
            } else {
                kelasLengkap = `${tingkat} ${jurusan} ${nomor}`;
            }
            
            const waktu = document.getElementById('inputWaktu').value.trim();
            const pembayaran = document.getElementById('inputPembayaran').value;
            const totalBayar = hitungHarga(selectedJumlah).toLocaleString('id-ID');

            const formatPesan = `Halo, saya ingin memesan Pizza Mini!%0A%0ANama : ${nama}%0AKelas : ${kelasLengkap}%0AWaktu Diambil : ${waktu}%0AJumlah Pesanan : ${selectedJumlah} slice%0AMetode Pembayaran : ${pembayaran}%0ATotal : Rp ${totalBayar}`;

            const nomorWA = "628123731343";
            const urlWA = `https://wa.me/${nomorWA}?text=${formatPesan}`;

            window.open(urlWA, '_blank');
        });
    </script>

</body>
</html>
